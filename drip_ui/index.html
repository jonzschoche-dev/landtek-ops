<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drip · LandTek</title>
<style>
:root{--bg:#0d1117;--pn:#161b22;--ln:#2a313c;--tx:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--go:#2ea043;--hold:#d29922}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:grid;grid-template-columns:1fr 380px;grid-template-rows:72px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--ln)}
header iframe{width:64px;height:64px;border:0;border-radius:50%;overflow:hidden;pointer-events:none}
header h1{font-size:16px;margin:0}header small{color:var(--mu)}
#main{display:flex;flex-direction:column;min-height:0;position:relative}
#thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 12px;border-radius:14px;white-space:pre-wrap}.u{align-self:flex-end;background:#1f6feb33}.b{align-self:flex-start;background:var(--pn);border:1px solid var(--ln)}
.tools{color:var(--mu);font-size:12px;margin-top:4px}.chip{display:inline-block;background:#30363d;border-radius:10px;padding:2px 8px;margin:2px;font-size:12px;cursor:pointer}
.card{border:1px solid var(--ac);border-radius:10px;padding:10px;margin-top:8px;background:#0d1117}.card pre{white-space:pre-wrap;font:13px/1.4 inherit;margin:6px 0}
.card button{margin-right:6px}.st{font-weight:600;text-transform:uppercase;font-size:11px}
#composer{border-top:1px solid var(--ln);padding:10px;display:flex;flex-direction:column;gap:6px}
#att{display:flex;flex-wrap:wrap}#row{display:flex;gap:6px}textarea{flex:1;resize:none;height:56px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font:inherit}
button{background:#21262d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer}button.pri{background:var(--ac);color:#000;border:0}
button.rec{background:#da3633}
#drop{position:absolute;inset:0;background:#1f6feb44;border:3px dashed var(--ac);display:none;align-items:center;justify-content:center;font-size:20px}
aside{border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex}#tabs button{flex:1;border-radius:0}#tabs .on{background:var(--pn);border-bottom:2px solid var(--ac)}
#fq{margin:6px;padding:6px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px}
#list{flex:1;overflow:auto;min-height:120px}#list div{padding:6px 10px;border-bottom:1px solid var(--ln);cursor:pointer}#list div:hover{background:var(--pn)}
#list small{color:var(--mu);display:block}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.acts button{padding:2px 7px;font-size:12px}
#list b{display:block;padding:8px 10px 2px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
#pv{height:45%;border-top:1px solid var(--ln);overflow:auto;padding:8px}#pv iframe,#pv img{width:100%;border:0}#pv iframe{height:100%}#pv pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<header><iframe id="orb" src="orb.html?mini"></iframe><div><h1>Drip Bot</h1><small id="status">idle · nothing leaves without your Go</small></div>
<div style="flex:1;display:flex;justify-content:center"><input id="sq" placeholder="🔎 Search a matter, office, person, title, TCT… (e.g. MWK-CV6839, Abla, T-52540)" style="width:min(520px,90%);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--tx)"></div><button id="speak" title="Read replies aloud">🔊 Voice on</button></header>
<section id="main"><div id="thread"></div>
<div id="composer"><div id="att"></div><div id="row">
<button id="pick" title="Attach files">📎</button><input type="file" id="fi" multiple hidden>
<button id="mic" title="Dictate (fil-PH)">🎙</button>
<textarea id="tx" placeholder="Utos mo, boss… drop or paste any file here"></textarea><button class="pri" id="send">Send</button></div></div>
<div id="drop">Drop files to upload to the drip inbox</div></section>
<aside><div id="tabs"><button data-t="uploads" class="on">Uploads</button><button data-t="corpus">Corpus</button><button data-t="queue">Drip queue</button><button data-t="prospects">Prospects</button></div>
<input id="fq" placeholder="Filter…"><div id="list"></div><div id="pv"><small style="color:var(--mu)">Click a file to preview</small></div></aside>
<script>
const $=s=>document.querySelector(s),thread=$('#thread');let pending=[],tab='uploads',voice=true;
const orb=st=>{$('#orb').contentWindow.postMessage({state:st},'*');$('#status').textContent=['idle','listening…','thinking…','speaking…'][st]+' · nothing leaves without your Go'};
const esc=s=>(s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;thread.appendChild(d);thread.scrollTop=1e9;return d}
function cite(t){return esc(t).replace(/\[(doc|upload) #(\d+)\]/g,(m,k,i)=>`<span class="chip" onclick="pv('${k}',${i})">${k} #${i}</span>`)}
function gateHtml(g){if(!g)return'';return `<div class="tools">Gate ${g.mark} · `+g.lines.map(l=>`${l[1]} ${esc(l[0])}${l[1]!='✅'?': '+esc(l[2]):''}`).join(' · ')+`</div>`}
function card(d){return `<div class="card" id="d${d.id}"><span class="st">Draft #${d.id} · ${d.state}${d.gmail_draft_id?' · in Gmail Drafts':''}</span><br><b>Ladder:</b> <input class="lad" value="${esc(d.ladder||'')}" placeholder="ladder, e.g. RD-T52540-ENTRIES" style="width:60%"><br><b>To:</b> ${esc(d.to_addr)} ${d.cc?'<b>Cc:</b> '+esc(d.cc):''}<br><b>Subject:</b> ${esc(d.subject)}${gateHtml(d.gate)}<pre contenteditable="true">${esc(d.body)}</pre>
<button style="background:var(--go)" onclick="dec(${d.id},'go')">Go</button><button onclick="dec(${d.id},'edit')">Save edit</button><button style="background:var(--hold);color:#000" onclick="dec(${d.id},'hold')">Hold</button></div>`}
async function dec(id,d){const body=$('#d'+id+' pre').innerText,ladder=$('#d'+id+' .lad').value.trim();let note='';
if(d=='go'&&$('#d'+id+' .tools')&&$('#d'+id+' .tools').textContent.includes('Gate ⛔')){note=prompt('Gate shows ⛔. Type "override" and a reason to stage it anyway (or Cancel):')||'';if(!note)return}
const r=await fetch(`api/draft/${id}/decide`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:d,body,ladder,note})});const j=await r.json();
if(!r.ok){$('#d'+id+' .st').textContent=`Draft #${id} · not staged: ${j.error||r.status}`;if(j.gate)$('#d'+id+' .st').insertAdjacentHTML('afterend',gateHtml(j.gate));return}
$('#d'+id+' .st').textContent=d=='go'?`Draft #${id} · in your Gmail Drafts (jonzschoche) — review and send from Gmail`:`Draft #${id} · ${j.draft.state}`;}
async function upload(files){if(!files.length)return;const fd=new FormData();for(const f of files)fd.append('files',f,f.name||'pasted.png');
$('#status').textContent='uploading '+files.length+' file(s)…';const j=await (await fetch('api/upload',{method:'POST',body:fd})).json();
for(const f of j.files){pending.push(f.id);$('#att').insertAdjacentHTML('beforeend',`<span class="chip" onclick="pv('upload',${f.id})">📄 ${esc(f.filename)} #${f.id}</span>`)}orb(0);if(tab=='uploads')load()}
async function send(){const m=$('#tx').value.trim();if(!m&&!pending.length)return;add('u',esc(m)+(pending.length?`<div class="tools">📎 uploads ${pending.join(', ')}</div>`:''));
$('#tx').value='';const ids=pending;pending=[];$('#att').innerHTML='';orb(2);
try{const j=await (await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m||'(see attached)',upload_ids:ids})})).json();
const d=add('b',j.error?'⚠ '+esc(j.error):cite(j.reply));if(j.tools?.length)d.insertAdjacentHTML('beforeend',`<div class="tools">🔧 ${j.tools.map(t=>t.tool).join(' → ')}</div>`);
(j.drafts||[]).forEach(x=>d.insertAdjacentHTML('beforeend',card(x)));if(voice&&j.reply)say(j.reply);else orb(0)}catch(e){add('b','⚠ '+e);orb(0)}}
function say(t){const u=new SpeechSynthesisUtterance(t.replace(/\[(doc|upload) #\d+\]/g,'').slice(0,600));const vs=speechSynthesis.getVoices();
u.voice=vs.find(v=>/fil|tl/i.test(v.lang))||vs.find(v=>/en-PH/i.test(v.lang))||null;u.onstart=()=>orb(3);u.onend=()=>orb(0);speechSynthesis.speak(u)}
$('#speak').onclick=()=>{voice=!voice;$('#speak').textContent=voice?'🔊 Voice on':'🔈 Voice off';speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('#mic').onclick=()=>{if(!SR)return alert('Dictation needs Chrome/Edge/Safari');if(rec){rec.stop();return}
rec=new SR();rec.lang='fil-PH';rec.interimResults=true;rec.continuous=true;const base=$('#tx').value;
rec.onresult=e=>{$('#tx').value=base+' '+[...e.results].map(r=>r[0].transcript).join('')};rec.onend=()=>{rec=null;$('#mic').classList.remove('rec');orb(0)};
rec.onerror=e=>{if(e.error=='language-not-supported'){rec.lang='en-PH'}};rec.start();$('#mic').classList.add('rec');orb(1)};
$('#send').onclick=send;$('#tx').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#pick').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{upload([...e.target.files]);e.target.value=''};
document.addEventListener('paste',e=>{const f=[...e.clipboardData.files];if(f.length){e.preventDefault();upload(f)}});
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').style.display='flex'});addEventListener('dragleave',()=>{if(--dc<=0)$('#drop').style.display='none'});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').style.display='none';upload([...e.dataTransfer.files])});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));load()});
$('#fq').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(load,300)};
$('#sq').onkeydown=e=>{if(e.key=='Enter')doSearch()};
async function load(){const L=$('#list');if(tab=='search'){return doSearch(window._sq)}const dd=x=>x?new Date(x).toLocaleDateString('en-PH',{day:'2-digit',month:'short'}):'—';
const B=(label,js)=>`<button onclick="event.stopPropagation();${js}">${label}</button>`;
if(tab=='queue'){const j=await (await fetch('api/queue')).json();
L.innerHTML='<b>Next targets</b>'+(j.targets||[]).map((t,n)=>`<div onclick="${t.ladder=='(calendar)'?`ask('Help me prepare: ${jsq(t.what)}')`:`openLadder('${jsq(t.ladder)}')`}">🎯 ${n+1}. ${esc(t.ladder)} <small>${esc(t.matter)} · ${esc(t.what)} · ${esc(t.channel)}</small><div class="acts">`+
 (t.ladder!='(calendar)'?B('Open',`openLadder('${jsq(t.ladder)}')`)+B('Draft follow-up',`ask('Draft the next drip step for ladder ${jsq(t.ladder)}: ${jsq(t.what)}')`)+B('Log call',`logOn('${jsq(t.ladder)}','call')`)+B('Note',`logOn('${jsq(t.ladder)}','note')`):B('Prepare with bot',`ask('Help me prepare: ${jsq(t.what)}')`))+`</div></div>`).join('')+
'<b>Drafts</b>'+j.drafts.map(d=>`<div onclick='showDraft(${JSON.stringify(d).replace(/'/g,"&#39;")})'>📝 Draft #${d.id} · ${d.state}${d.gate?' · gate '+d.gate.mark:''}<small>${esc(d.ladder||'no ladder')} · ${esc(d.subject)}</small><div class="acts">${B('Review',`showDraft(${JSON.stringify(d).replace(/'/g,"&#39;").replace(/"/g,'&quot;')})`)}${d.ladder?B('Ladder',`openLadder('${jsq(d.ladder)}')`):''}</div></div>`).join('')+
'<b>Live clocks · 15 working days from proof of receipt</b>'+j.obligations.map(o=>`<div onclick="openLadder('${jsq(o.ladder)}')">⏳ ${esc(o.ladder)}<small>${esc(o.office)} · served ${dd(o.served_at)} · due ${dd(o.due_at)} · ${o.state}</small><div class="acts">`+
 B('Open',`openLadder('${jsq(o.ladder)}')`)+B('Reply came',`logOn('${jsq(o.ladder)}','reply')`)+B('Done',`logOn('${jsq(o.ladder)}','performed')`)+B('Log call',`logOn('${jsq(o.ladder)}','call')`)+B('Draft tracer',`ask('Draft a calm tracer for ladder ${jsq(o.ladder)} (due ${dd(o.due_at)})')`)+`</div></div>`).join('');return}
if(tab=='prospects'){const lane=window._lane||'drip';const j=await (await fetch(`api/prospects?lane=${lane}&q=${encodeURIComponent($('#fq').value)}`)).json();
L.innerHTML=`<div class="acts" style="padding:6px 10px">`+['drip','legal_desk','counsel','hold'].map(l=>`<button style="${l==lane?'background:var(--ac);color:#000':''}" onclick="window._lane='${l}';load()">${l} (${j.counts[l]||0})</button>`).join('')+`</div>`+
 j.prospects.map(p=>`<div onclick="openProspect(${p.id})">💡 ${esc(p.title)}<small>${esc(p.matter_code)} · ${esc(p.kind)} · score ${p.score} · ${esc(p.source_ref)}</small><div class="acts">`+B('Open',`openProspect(${p.id})`)+
 (p.lane=='drip'?B('Promote to ladder',`prAct(${p.id},'promote')`)+B('Draft ask',`ask('Draft a calm records request for this prospect (#${p.id}): ${jsq(p.title)}')`):B('Ask bot',`ask('About prospect #${p.id} (${p.lane}): ${jsq(p.title)} — what are the options?')`))+
 B('Lane…',`prAct(${p.id},'lane')`)+B('Dismiss',`prAct(${p.id},'dismiss')`)+`</div></div>`).join('');return}
const j=await (await fetch(`api/files?src=${tab}&q=${encodeURIComponent($('#fq').value)}`)).json();
L.innerHTML=j.files.map(f=>`<div onclick="pv('${tab=='uploads'?'upload':'doc'}',${f.id})">${tab=='uploads'?'📎':'📚'} ${esc(f.filename)}<small>#${f.id} · ${esc(f.mime||'')} ${f.matter_code?'· '+esc(f.matter_code):''} ${f.date||f.created_at||''}</small></div>`).join('')||'<div>Nothing yet</div>'}
function showDraft(d){$('#pv').innerHTML=card(d)}
async function doSearch(qq){qq=(qq??$('#sq').value).trim();if(qq.length<2)return;window._sq=qq;$('#sq').value=qq;tab='search';document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
 const L=$('#list');L.innerHTML='<small style="padding:10px;display:block">searching…</small>';const j=await (await fetch('api/search?q='+encodeURIComponent(qq))).json();
 if(j.error){L.innerHTML=esc(j.error);return}const dd=x=>x?new Date(x).toLocaleDateString('en-PH',{day:'2-digit',month:'short',year:'2-digit'}):'—';
 const B=(label,js)=>`<button onclick="event.stopPropagation();${js}">${label}</button>`;const sec=(t,a)=>a&&a.length?`<b>${t} (${a.length})</b>`:'';
 L.innerHTML=`<div class="acts" style="padding:6px 10px">${B('Brief me on this',`ask('Brief me on ${jsq(qq)}: where it stands, open clocks, prospects, and the next step (cite docs).')`)}</div>`+
 sec('Matters',j.matters)+j.matters.map(m=>`<div onclick="doSearch('${jsq(m.matter_code)}')">📁 ${esc(m.matter_code)}<small>${esc(m.title)} · ${esc(m.status)} · ${esc((m.next_event||'').slice(0,120))}</small><div class="acts">${B('Dig in',`doSearch('${jsq(m.matter_code)}')`)}${B('Brief',`ask('Brief me on ${jsq(m.matter_code)} with citations.')`)}</div></div>`).join('')+
 sec('Live clocks',j.clocks)+j.clocks.map(o=>`<div onclick="openLadder('${jsq(o.ladder)}')">⏳ ${esc(o.ladder)}<small>${esc(o.office)} · due ${dd(o.due_at)} · ${o.state}</small></div>`).join('')+
 sec('Ladders',j.ladders)+j.ladders.map(l=>`<div onclick="openLadder('${jsq(l.ladder)}')">🪜 ${esc(l.ladder)}<small>${esc(l.matter_code)} · ${esc(l.state)} · ${esc(l.addressee||'')} ${l.due_at?'· due '+dd(l.due_at):''}</small><div class="acts">${B('Open',`openLadder('${jsq(l.ladder)}')`)}${B('Draft next step',`ask('Draft the next drip step for ladder ${jsq(l.ladder)}')`)}</div></div>`).join('')+
 sec('Prospects',j.prospects)+j.prospects.map(p=>`<div onclick="openProspect(${p.id})">💡 ${esc(p.title)}<small>${esc(p.matter_code)} · ${esc(p.kind)} · ${p.lane} · ${esc(p.source_ref)}</small><div class="acts">${p.lane=='drip'?B('Promote',`prAct(${p.id},'promote')`):''}${B('Lane…',`prAct(${p.id},'lane')`)}${B('Dismiss',`prAct(${p.id},'dismiss')`)}${p.source_ref.startsWith('documents:')?B('Source',`pv('doc',${p.source_ref.split(':')[1]})`):''}</div></div>`).join('')+
 sec('Documents',j.documents)+j.documents.map(f=>`<div onclick="pv('doc',${f.id})">📚 ${esc(f.title)}<small>#${f.id} · ${esc(f.matter_code||'')} · ${esc(f.date||'')}</small></div>`).join('')+
 sec('E-mails',j.emails)+j.emails.map(e=>`<div>✉️ ${esc(e.subject)}<small>${esc(e.from_addr)} · ${dd(e.received_at)}</small></div>`).join('')+
 sec('Drip events',j.events)+j.events.map(e=>`<div onclick="${e.ladder?`openLadder('${jsq(e.ladder)}')`:''}">• ${esc(e.kind)} ${esc(e.ladder||'')}<small>${esc(e.event_date||'')} ${esc(e.detail)}</small></div>`).join('')}
const jsq=t=>(t??'').toString().replace(/\\/g,'').replace(/'/g,"’").replace(/"/g,'”').replace(/\n/g,' ').slice(0,300);
function ask(t){$('#tx').value=t;$('#tx').focus()}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();return j.error?'⚠ '+j.error:(j.message||'ok')}
async function logOn(ladder,action){let b={action};
 if(action=='reply'){b.note=prompt('What did they say? (short)');if(b.note===null)return;b.from=prompt('From (e-mail or office):','')||'(office)';b.doc=prompt('Corpus doc # of the reply (optional — starts the clock if none running):','')||null;b.outcome=(prompt('Outcome: ack / answered / partial / performed','ack')||'ack')}
 else if(action=='receipt'){b.doc=prompt('Corpus doc # that proves receipt (stamped copy / their e-mail):');if(!b.doc)return;b.by=prompt('Received by (name):','')||null}
 else{b.note=prompt(action=='call'?'Call notes (who, what they said):':action=='performed'?'What was done / received?':'Note:');if(b.note===null)return}
 const m=await post(`api/ladder/${encodeURIComponent(ladder)}/log`,b);add('b',esc(`${ladder}: ${m}`));load();if(document.querySelector('#pv .lad-h'))openLadder(ladder)}
async function prAct(id,action){let b={action};
 if(action=='promote'){b.ladder=prompt('Ladder name (e.g. RD-T47657-PLAN):','');if(b.ladder===null)return}
 if(action=='lane'){b.lane=prompt('Lane: drip / legal_desk / counsel / hold','legal_desk');if(!b.lane)return}
 if(action=='dismiss'){b.note=prompt('Why dismiss? (optional)','');if(b.note===null)return}
 add('b',esc(`Prospect #${id}: `+await post(`api/prospect/${id}/action`,b)));load()}
async function openProspect(id){const j=await (await fetch('api/prospect/'+id)).json();const p=j.prospect;if(!p){$('#pv').innerHTML='not found';return}
 const B=(label,js)=>`<button onclick="${js}">${label}</button>`;const docId=(p.source_ref||'').startsWith('documents:')?p.source_ref.split(':')[1]:null;
 $('#pv').innerHTML=`<b>💡 Prospect #${p.id}</b><div class="tools">${esc(p.matter_code)} · ${esc(p.kind)} · lane <b style="display:inline;padding:0;color:var(--tx)">${esc(p.lane)}</b> · score ${p.score} · ${esc(p.status)}${p.ladder?' · ladder '+esc(p.ladder):''}</div>
 <p style="margin:8px 0;font-size:14px">${esc(p.title)}</p>
 <div class="acts">`+(p.lane=='drip'&&p.status=='new'?B('Promote to ladder',`prAct(${p.id},'promote')`)+B('Draft ask',`ask('Draft a calm records request for prospect #${p.id}: ${jsq(p.title)}')`):'')+
 B('Ask bot',`ask('About prospect #${p.id} (${p.lane}): ${jsq(p.title)} — what does the record show and what are the options? Cite docs.')`)+B('Lane…',`prAct(${p.id},'lane')`)+B('Dismiss',`prAct(${p.id},'dismiss')`)+
 (docId?B('Open source doc',`pv('doc',${docId})`):'')+(p.ladder?B('Open ladder',`openLadder('${jsq(p.ladder)}')`):'')+`</div>`+
 (p.excerpt?`<div class="tools" style="margin-top:8px">Source quote:</div><pre>${esc(p.excerpt)}</pre>`:'')+
 (p.detail&&p.detail!=p.title?`<div class="tools">Detail:</div><pre>${esc(p.detail)}</pre>`:'')+
 `<div class="tools">Source: ${esc(p.source_ref)} · first seen ${esc((p.first_seen||'').slice(0,16))}${p.decision_note?' · note: '+esc(p.decision_note):''}</div>`+
 (j.source_text?`<div class="tools">In the file:</div><pre>${esc(j.source_text)}</pre>`:'')}
async function openLadder(name){const j=await (await fetch('api/ladder/'+encodeURIComponent(name))).json();const dd=x=>x?new Date(x).toLocaleDateString('en-PH',{day:'2-digit',month:'short',year:'numeric'}):'—';
 const B=(label,js)=>`<button onclick="${js}">${label}</button>`;const n=jsq(name);
 $('#pv').innerHTML=`<div class="lad-h"><b>${esc(name)}</b></div>`+(j.clocks||[]).map(c=>`<div class="tools">⏳ ${c.state} · served ${dd(c.served_at)} · due ${dd(c.due_at)} · proof doc ${c.service_proof_doc_id?`<span class="chip" onclick="pv('doc',${c.service_proof_doc_id})">doc #${c.service_proof_doc_id}</span>`:'—'}</div>`).join('')+

 ((j.steps||[]).length?'<div class="tools">Steps: '+j.steps.map(s=>`${s.seq}. ${esc(s.state)} · ${esc((s.the_ask||'').slice(0,80))}`).join(' | ')+'</div>':'')+

async function pv(kind,id){const P=$('#pv');if(kind=='doc'){const d=await (await fetch('api/doc/'+id)).json();
P.innerHTML=`<b>${esc(d.title)}</b> <small>doc #${id} · ${esc(d.matter_code)} · ${esc(d.date)}</small> ${d.drive_link?`<a href="${esc(d.drive_link)}" target="_blank">Drive ↗</a>`:''}<div class="acts"><button onclick="ask('Using [doc #${id}], ')">Ask about it</button><button onclick="ask('Draft a drip step that cites [doc #${id}]: ')">Use in a draft</button><button onclick="ask('Is [doc #${id}] proof of receipt for one of our ladders? Which one?')">Proof of receipt?</button></div><pre>${esc(d.text||d.summary||'(no text)')}</pre>`;return}
const f=(await (await fetch('api/files?src=uploads')).json()).files.find(x=>x.id==id)||{};const u='api/raw/upload/'+id,m=f.mime||'';
if(m.startsWith('image/'))P.innerHTML=`<img src="${u}">`;else if(m.startsWith('audio/'))P.innerHTML=`<b>${esc(f.filename)}</b><audio controls src="${u}" style="width:100%"></audio>`;
else if(m.startsWith('video/'))P.innerHTML=`<video controls src="${u}" style="width:100%"></video>`;else if(m=='application/pdf')P.innerHTML=`<iframe src="${u}"></iframe>`;
else{const t=await (await fetch('api/upload_text/'+id)).json();P.innerHTML=`<b>${esc(f.filename)}</b> <a href="${u}" download>download</a><pre>${esc(t.text||'(no text preview)')}</pre>`}}
(async()=>{const j=await (await fetch('api/history')).json();for(const r of j.messages){if(r.role=='user')add('u',esc(r.content)+(r.upload_ids?.length?`<div class="tools">📎 uploads ${r.upload_ids.join(', ')}</div>`:''));else{const d=add('b',cite(r.content));const t=(r.meta?.tools||[]).map(x=>x.tool);if(t.length)d.insertAdjacentHTML('beforeend',`<div class="tools">🔧 ${t.join(' → ')}</div>`);(r.drafts||[]).forEach(x=>d.insertAdjacentHTML('beforeend',card(x)))}}})();
